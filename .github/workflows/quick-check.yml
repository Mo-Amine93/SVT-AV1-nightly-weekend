# Quick check of the self-hosted runners (~1 h): the real Cleanup and builds of nightly-weekend.yml, then 4 lanes like
# weekend.yml on one chosen machine (R2R, Low Delay, Fast Decode, MR, debug, features, reference + Compare tests)
# and the 3 Mac tests on jimmy. Made by make_quick_check.py.
name: Quick check

on:
  workflow_dispatch:
    inputs:
      machine:
        description: supermicro to check (Ubuntu10,11,12,14 = supermicro1,2,3,5; supermicro4 not used)
        type: choice
        options: [Ubuntu10, Ubuntu11, Ubuntu12, Ubuntu14]
        default: Ubuntu10
      mac:
        description: also check jimmy (R2R-Macos1)
        type: boolean
        default: true
      ref:
        description: AOMediaCodec/SVT-AV1 branch, tag or commit to test
        default: main

permissions:
  contents: read

# shares the group with the nightly and weekend workflows, so they never run at the same time
concurrency:
  group: nightly-weekend
  cancel-in-progress: false

env:
  WEEKEND: '0'
  SVT_REF: ${{ inputs.ref }}

jobs:
  cleanup:
    name: Cleanup (${{ matrix.machine }})
    runs-on: [self-hosted, '${{ matrix.machine }}']
    strategy:
      fail-fast: false
      matrix:
        machine: ['${{ inputs.machine }}']
    steps:
      - name: Cleanup
        run: |
          if pgrep -f "[P]yFeaturesControl.py" > /dev/null; then echo "A PyFeaturesControl run is still active on this machine, not deleting its bitstreams"; exit 1; fi
          rm -rf /home/Nightly_Script/bitstreams/
          rm -rf /home/Weekend_Script/bitstreams/
          rm -rf /home/CI_Script/bitstreams/
          rm -rf /dev/shm/bitstreams/*
          rm -rf /home/inteladmin/stream/weekend_run_set/8bit/random_res
          find /home/gitlab-runner/builds -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          find /var/lib/gitlab-runner/builds -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          find /home/gitlab-runner/actions-runner-*/_work -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          mkdir /home/CI_Script/bitstreams/
          mkdir -p /dev/shm/bitstreams/
          curl "https://gitlab.com/api/v4/projects/21956795/repository/files/.gitlab%2Fworkflows%2Fweekend-testing%2FPyFeaturesControl%2Epy?ref=ci-build-testing" | cut -d '"' -f 40 | base64 -d > /home/CI_Script/PyFeaturesControl.py
          curl "https://gitlab.com/api/v4/projects/21956795/repository/files/scripts%2Fdebug_testing%2FPyIssueTracker%2Epy?ref=master" | cut -d '"' -f 40 | base64 -d > /home/CI_Script/PyIssueTracker.py
          chmod +x /home/CI_Script/PyFeaturesControl.py
          chmod +x /home/CI_Script/PyIssueTracker.py

  build:
    name: Linux (18.04, static)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build with GCC 11 in the aom-testing ubuntu2004 image (as SVT-AV1's own GitLab Linux builds)
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src -e CC=gcc-11 -e CXX=g++-11 \
            -e CFLAGS="-Werror -Wshadow -pipe" \
            -e CXXFLAGS="-Werror -Wshadow -pipe" \
            -e LDFLAGS="-Werror -Wshadow -pipe -static -static-libgcc -static-libstdc++" \
            registry.gitlab.com/aomediacodec/aom-testing/ubuntu2004 sh -ec '
              git config --global --add safe.directory /src
              cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
              cmake --build Build --config Release'
          cp Bin/Release/SvtAv1EncApp .
          [ ! -f Bin/Release/SvtAv1DecApp ] || cp Bin/Release/SvtAv1DecApp .   # SVT-AV1 has no decoder app now
      - uses: actions/upload-artifact@v7
        with:
          name: linux-static
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  build-debug:
    name: Linux (18.04, static, debug)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build with GCC 11 in the aom-testing ubuntu2004 image (as SVT-AV1's own GitLab Linux builds)
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src -e CC=gcc-11 -e CXX=g++-11 \
            -e CFLAGS="-Werror -Wshadow -pipe" \
            -e CXXFLAGS="-Werror -Wshadow -pipe" \
            -e LDFLAGS="-Werror -Wshadow -pipe -static -static-libgcc -static-libstdc++" \
            registry.gitlab.com/aomediacodec/aom-testing/ubuntu2004 sh -ec '
              git config --global --add safe.directory /src
              cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
              cmake --build Build --config Debug'
          cp Bin/Debug/SvtAv1EncApp .
          [ ! -f Bin/Debug/SvtAv1DecApp ] || cp Bin/Debug/SvtAv1DecApp .   # SVT-AV1 has no decoder app now
      - uses: actions/upload-artifact@v7
        with:
          name: linux-static-debug
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  cleanup-mac:
    name: Cleanup (mac)
    if: ${{ inputs.mac }}
    runs-on: [self-hosted, R2R-Macos1]
    steps:
      - name: Cleanup
        run: |
          rm -rf /Users/Nightly_Script/bitstreams || true
          rm -rf /Users/Weekend_Script/bitstreams || true
          rm -rf /Users/CI_Script/bitstreams || true
          rm -rf /Users/inteladmin/stream/weekend_run_set/8bit/random_res || true
          mkdir -p /Users/CI_Script/bitstreams
          curl -sSLo /Users/CI_Script/PyFeaturesControl.py "https://gitlab.com/api/v4/projects/21956795/repository/files/.gitlab%2Fworkflows%2Fweekend-testing%2FPyFeaturesControl%2Epy/raw?ref=ci-build-testing"
          curl -sSLo /Users/CI_Script/PyIssueTracker.py "https://gitlab.com/api/v4/projects/21956795/repository/files/scripts%2Fdebug_testing%2FPyIssueTracker%2Epy?ref=master"
          chmod +x /Users/CI_Script/PyFeaturesControl.py /Users/CI_Script/PyIssueTracker.py

  build-mac:
    name: macOS (Release)
    if: ${{ inputs.mac }}
    needs: [cleanup-mac]
    runs-on: [self-hosted, R2R-Macos1]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build
        env:
          CFLAGS: -Werror -Wshadow -pipe
          CXXFLAGS: -Werror -Wshadow -pipe
          LDFLAGS: -Werror -Wshadow -pipe
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --version
          nasm -v || { echo "Install nasm on the Mac (brew install nasm)"; exit 1; }
          cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build Build --config Release
          cp Bin/Release/SvtAv1EncApp .
          [ ! -f Bin/Release/SvtAv1DecApp ] || cp Bin/Release/SvtAv1DecApp .   # SVT-AV1 has no decoder app now
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  lane-1:
    name: Lane 1 (6 tests one after another, as in weekend.yml)
    needs: [cleanup, build, build-debug]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, '${{ inputs.machine }}']
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-static
          path: bin/linux-static
      - uses: actions/download-artifact@v8
        with:
          name: linux-static-debug
          path: bin/linux-static-debug
      - name: Get the controller scripts
        run: |
          cp /home/CI_Script/PyFeaturesControl.py .
          cp /home/CI_Script/scripts/yuv_library.py .
      - name: "R2R Ubuntu10 Low Delay: [0, 5, --pred-struct 1, CBR-1lp-1p-10bit_r2r_test]"
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        env:
          test: CBR-1lp-1p-10bit_r2r_test
          debug: 0
          cpu_use_divisor: 5
          special_param: "--pred-struct 1"
        run: |
          cp -f bin/linux-static/SvtAv1EncApp . && chmod +x SvtAv1EncApp
          [ ! -f bin/linux-static/SvtAv1DecApp ] || { cp -f bin/linux-static/SvtAv1DecApp . && chmod +x SvtAv1DecApp; }
          python2 PyFeaturesControl.py -t $test -d $debug -p "$special_param" -m 0 --cpu_use_divisor "$cpu_use_divisor"
      - name: "Features Ubuntu12 debug A: [1, still_image_test]"
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        env:
          test: still_image_test
          debug: 1
        run: |
          cp -f bin/linux-static-debug/SvtAv1EncApp . && chmod +x SvtAv1EncApp
          [ ! -f bin/linux-static-debug/SvtAv1DecApp ] || { cp -f bin/linux-static-debug/SvtAv1DecApp . && chmod +x SvtAv1DecApp; }
          python2 PyFeaturesControl.py -t $test -d $debug -p "$special_param" -m $WEEKEND --cpu_use_divisor "$cpu_use_divisor"
      - name: "Features Ubuntu12 debug A: [1, SuperResQThres_%s_test]"
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        env:
          test: SuperResQThres_%s_test
          debug: 1
        run: |
          cp -f bin/linux-static-debug/SvtAv1EncApp . && chmod +x SvtAv1EncApp
          [ ! -f bin/linux-static-debug/SvtAv1DecApp ] || { cp -f bin/linux-static-debug/SvtAv1DecApp . && chmod +x SvtAv1DecApp; }
          python2 PyFeaturesControl.py -t $test -d $debug -p "$special_param" -m $WEEKEND --cpu_use_divisor "$cpu_use_divisor"
      - name: "Features Ubuntu12 debug A: [1, RateControl_%s_test]"
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        env:
          test: RateControl_%s_test
          debug: 1
        run: |
          cp -f bin/linux-static-debug/SvtAv1EncApp . && chmod +x SvtAv1EncApp
          [ ! -f bin/linux-static-debug/SvtAv1DecApp ] || { cp -f bin/linux-static-debug/SvtAv1DecApp . && chmod +x SvtAv1DecApp; }
          python2 PyFeaturesControl.py -t $test -d $debug -p "$special_param" -m $WEEKEND --cpu_use_divisor "$cpu_use_divisor"
      - name: "Features Ubuntu12 debug B: [1, scd_test_%s]"
