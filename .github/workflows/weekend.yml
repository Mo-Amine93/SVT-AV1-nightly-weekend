          cp /home/CI_Script/PyFeaturesControl.py .
          cp /home/CI_Script/scripts/yuv_library.py .
      - name: "R2R Ubuntu13: [0, 6, nonlp-1p-8bit_r2r_test] (est. 28.8 h)"
