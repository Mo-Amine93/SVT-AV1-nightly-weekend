  mac-arm-still-image:
    name: Mac arm_still_image
    needs: [cleanup-mac, build-mac]
    if: ${{ inputs.mac && !cancelled() }}
    runs-on: [self-hosted, R2R-Macos1]
    timeout-minutes: 4320
    env:
      test: arm_still_image_test
      debug: 0
      cpu_use_divisor: 3
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
      - name: Run the test
        run: |
          chmod +x SvtAv1EncApp
          [ ! -f SvtAv1DecApp ] || chmod +x SvtAv1DecApp
          cp /Users/CI_Script/PyFeaturesControl.py . || true
          test -f /Users/CI_Script/scripts/yuv_library.py && cp /Users/CI_Script/scripts/yuv_library.py . || true
          which python2 && python2 -V
          python2 PyFeaturesControl.py -t "$test" -d "${debug:-0}" -p "${special_param:-}" -m "${WEEKEND:-nightly}" --cpu_use_divisor "${cpu_use_divisor:-3}"

