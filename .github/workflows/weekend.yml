    name: Ubuntu10 lane 1 (est. 30.7 h, 8 tests)
    needs: [cleanup, build, build-debug]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Ubuntu10]
    timeout-minutes: 7200
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-static
          path: bin/linux-static
      - uses: actions/download-artifact@v8
        with:
          name: linux-static-debug
          path: bin/linux-static-debug
      - name: Get the controller scripts
