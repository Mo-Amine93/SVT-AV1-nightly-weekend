          - {label: "R2R Ubuntu13 Part Two: [0, 3, VBR-1lp-2p-8bit_r2r_test]", debug: 0, cpu_use_divisor: 3, test: VBR-1lp-2p-8bit_r2r_test}
          - {label: "R2R Ubuntu13 Part Two: [0, 3, VBR-1lp-1p-8bit_r2r_test]", debug: 0, cpu_use_divisor: 3, test: VBR-1lp-1p-8bit_r2r_test}
