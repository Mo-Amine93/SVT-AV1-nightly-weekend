# SVT-AV1 nightly and weekend tests on the supermicro self-hosted runners.
# Translated from the GitLab CI (aom-testing ci-build-testing 0fc9092, .gitlab/workflows/weekend-testing) by
# make_github_workflow.py: same jobs, matrix, machine split, Cleanup and PyFeaturesControl command lines.
# Started by hand only: Actions -> SVT-AV1 nightly and weekend tests -> Run workflow.
name: SVT-AV1 nightly and weekend tests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: nightly or weekend preset set (PyFeaturesControl -m 0 / -m 1)
        type: choice
        options: [nightly, weekend]
        default: nightly
      ref:
        description: AOMediaCodec/SVT-AV1 branch, tag or commit to test
        default: main
      pr:
        description: AOMediaCodec/SVT-AV1 pull request number to test instead (leave empty for ref)
        default: ''
      mac:
        description: also run the Mac jobs (on jimmy, runner label R2R-Macos1)
        type: boolean
        default: true

permissions:
  contents: read

# one run at a time: Cleanup deletes the bitstreams of every run on the machine
concurrency:
  group: nightly-weekend
  cancel-in-progress: false

env:
  WEEKEND: ${{ inputs.mode == 'weekend' && '1' || '0' }}
  SVT_REF: ${{ inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || inputs.ref }}

jobs:
  cleanup:
    name: Cleanup (${{ matrix.machine }})
    runs-on: [self-hosted, '${{ matrix.machine }}']
    strategy:
      fail-fast: false
      matrix:
        machine: [Ubuntu10, Ubuntu11, Ubuntu12, Ubuntu13, Ubuntu14]
    steps:
      - name: Cleanup
        run: |
          if pgrep -f "[P]yFeaturesControl.py" > /dev/null; then echo "A PyFeaturesControl run is still active on this machine, not deleting its bitstreams"; exit 1; fi
          rm -rf /home/Nightly_Script/bitstreams/
          rm -rf /home/Weekend_Script/bitstreams/
          rm -rf /home/CI_Script/bitstreams/
          rm -rf /dev/shm/bitstreams/*
          rm -rf /home/inteladmin/stream/weekend_run_set/8bit/random_res
          find /home/gitlab-runner/builds -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          find /var/lib/gitlab-runner/builds -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          find /home/gitlab-runner/actions-runner-*/_work -name "bitstreams" -type d -prune -exec rm -rf '{}' +
          mkdir /home/CI_Script/bitstreams/
          mkdir -p /dev/shm/bitstreams/
          curl "https://gitlab.com/api/v4/projects/21956795/repository/files/.gitlab%2Fworkflows%2Fweekend-testing%2FPyFeaturesControl%2Epy?ref=ci-build-testing" | cut -d '"' -f 40 | base64 -d > /home/CI_Script/PyFeaturesControl.py
          curl "https://gitlab.com/api/v4/projects/21956795/repository/files/scripts%2Fdebug_testing%2FPyIssueTracker%2Epy?ref=master" | cut -d '"' -f 40 | base64 -d > /home/CI_Script/PyIssueTracker.py
          chmod +x /home/CI_Script/PyFeaturesControl.py
          chmod +x /home/CI_Script/PyIssueTracker.py

  build:
    name: Linux (18.04, static)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build in the aom-testing ubuntu1804 image (same image as the GitLab CI)
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src \
            -e CFLAGS="-Werror -Wshadow -pipe" \
            -e CXXFLAGS="-Werror -Wshadow -pipe" \
            -e LDFLAGS="-Werror -Wshadow -pipe -static -static-libgcc -static-libstdc++" \
            registry.gitlab.com/aomediacodec/aom-testing/ubuntu1804 sh -ec '
              git config --global --add safe.directory /src
              cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
              cmake --build Build --config Release'
          cp Bin/Release/SvtAv1EncApp Bin/Release/SvtAv1DecApp .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-static
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  build-avx512:
    name: Linux (18.04, static, avx512)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build in the aom-testing ubuntu1804 image (same image as the GitLab CI)
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src \
            -e CFLAGS="-Werror -Wshadow -pipe" \
            -e CXXFLAGS="-Werror -Wshadow -pipe" \
            -e LDFLAGS="-Werror -Wshadow -pipe -static -static-libgcc -static-libstdc++" \
            registry.gitlab.com/aomediacodec/aom-testing/ubuntu1804 sh -ec '
              git config --global --add safe.directory /src
              cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local -D ENABLE_AVX512=ON
              cmake --build Build --config Release'
          cp Bin/Release/SvtAv1EncApp Bin/Release/SvtAv1DecApp .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-static-avx512
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  build-debug:
    name: Linux (18.04, static, debug)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build in the aom-testing ubuntu1804 image (same image as the GitLab CI)
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD:/src" -w /src \
            -e CFLAGS="-Werror -Wshadow -pipe" \
            -e CXXFLAGS="-Werror -Wshadow -pipe" \
            -e LDFLAGS="-Werror -Wshadow -pipe -static -static-libgcc -static-libstdc++" \
            registry.gitlab.com/aomediacodec/aom-testing/ubuntu1804 sh -ec '
              git config --global --add safe.directory /src
              cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
              cmake --build Build --config Debug'
          cp Bin/Debug/SvtAv1EncApp Bin/Debug/SvtAv1DecApp .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-static-debug
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  cleanup-mac:
    name: Cleanup (mac)
    if: ${{ inputs.mac }}
    runs-on: [self-hosted, R2R-Macos1]
    steps:
      - name: Cleanup
        run: |
          rm -rf /Users/Nightly_Script/bitstreams || true
          rm -rf /Users/Weekend_Script/bitstreams || true
          rm -rf /Users/CI_Script/bitstreams || true
          rm -rf /Users/inteladmin/stream/weekend_run_set/8bit/random_res || true
          mkdir -p /Users/CI_Script/bitstreams
          curl -sSLo /Users/CI_Script/PyFeaturesControl.py "https://gitlab.com/api/v4/projects/21956795/repository/files/.gitlab%2Fworkflows%2Fweekend-testing%2FPyFeaturesControl%2Epy/raw?ref=ci-build-testing"
          curl -sSLo /Users/CI_Script/PyIssueTracker.py "https://gitlab.com/api/v4/projects/21956795/repository/files/scripts%2Fdebug_testing%2FPyIssueTracker%2Epy?ref=master"
          chmod +x /Users/CI_Script/PyFeaturesControl.py /Users/CI_Script/PyIssueTracker.py

  build-mac:
    name: macOS (Release)
    if: ${{ inputs.mac }}
    needs: [cleanup-mac]
    runs-on: [self-hosted, R2R-Macos1]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: AOMediaCodec/SVT-AV1
          ref: ${{ env.SVT_REF }}
          fetch-depth: 0
          fetch-tags: true
      - name: Build
        env:
          CFLAGS: -Werror -Wshadow -pipe
          CXXFLAGS: -Werror -Wshadow -pipe
          LDFLAGS: -Werror -Wshadow -pipe
        run: |
          echo "Testing AOMediaCodec/SVT-AV1 $SVT_REF = $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --version
          nasm -v || { echo "Install nasm on the Mac (brew install nasm)"; exit 1; }
          cmake -B Build -DREPRODUCIBLE_BUILDS=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build Build --config Release
          cp Bin/Release/SvtAv1EncApp Bin/Release/SvtAv1DecApp .
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            SvtAv1EncApp
            SvtAv1DecApp
          retention-days: 30

  r2r-ubuntu13:
    name: ${{ matrix.label }}
    needs: [build, cleanup]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Ubuntu11]
    timeout-minutes: 4320
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "R2R Ubuntu13: [0, 6, nonlp-1p-8bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: nonlp-1p-8bit_r2r_test}
          - {label: "R2R Ubuntu13: [0, 6, 1lp-1p-10bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: 1lp-1p-10bit_r2r_test}
          - {label: "R2R Ubuntu13: [0, 6, CBR-1lp-1p-10bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: CBR-1lp-1p-10bit_r2r_test}
          - {label: "R2R Ubuntu13: [0, 6, CBR-1lp-1p-8bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: CBR-1lp-1p-8bit_r2r_test}
          - {label: "R2R Ubuntu13: [0, 6, VBR-1lp-2p-10bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: VBR-1lp-2p-10bit_r2r_test}
          - {label: "R2R Ubuntu13: [0, 6, VBR-1lp-1p-10bit_r2r_test]", debug: 0, cpu_use_divisor: 6, test: VBR-1lp-1p-10bit_r2r_test}
    env:
      test: ${{ matrix.test }}
      debug: ${{ matrix.debug }}
      cpu_use_divisor: ${{ matrix.cpu_use_divisor }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-static
      - name: Run the test
        run: |
          chmod +x SvtAv1EncApp SvtAv1DecApp
          cp /home/CI_Script/PyFeaturesControl.py .
          cp /home/CI_Script/scripts/yuv_library.py .
          python2 PyFeaturesControl.py -t $test -d $debug -p "$special_param" -m $WEEKEND --cpu_use_divisor "$cpu_use_divisor"

